[project]
name = "eukahub-api"
version = "0.1.0"
description = "FastAPI service serving the read-only genomic-resource dataset."
requires-python = ">=3.12"
dependencies = [
    "eukahub-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[tool.uv.sources]
eukahub-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eukahub_api"]
