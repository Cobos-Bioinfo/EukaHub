<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EukaHub</title>
    <!-- Stamp the theme before first paint so there's no light-flash on load.
         Keep the storage key + logic in sync with src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem("eukahub-theme");
          var t =
            v === "light" || v === "dark"
              ? v
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
