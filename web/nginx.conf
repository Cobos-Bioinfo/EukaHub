# EukaHub web — nginx serves the built SPA and proxies /api to the api service.

# Reverse-proxy cache for the read-only API. This file is included in nginx's
# `http` context (conf.d/*.conf), the only place proxy_cache_path is allowed.
# The dataset changes only on an offline rebuild, so proxied GETs are safe to
# cache; a shared nginx cache means repeat hits across all clients skip the API
# and the DB entirely. The cache complements the API's ETags: nginx answers a
# client's If-None-Match from the cached entry, and revalidates upstream with the
# ETag when an entry expires (a 304 avoids re-transferring the body).
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=256m inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API proxy: strip the /api prefix (mirrors the Vite dev proxy rewrite).
    # `api` resolves over the compose network; depends_on gates startup order.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache successful GETs. nginx honours the API's Cache-Control (so /health
        # `no-store` is never cached) and its ETag; proxy_cache_revalidate turns
        # an expired entry into a cheap upstream 304 instead of a full re-fetch.
        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_lock on;  # collapse a stampede of misses into one upstream hit
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Surface HIT/MISS/REVALIDATED for debugging and cache-tuning.
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        # Baseline security headers on the static SPA. HSTS + a CSP come with
        # TLS. /api responses carry their own headers from the API, so they're
        # set here (not server-wide) to avoid duplicates on the proxied path.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
