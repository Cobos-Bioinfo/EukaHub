# EukaHub web — nginx serves the built SPA and proxies /api to the api service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API proxy: strip the /api prefix (mirrors the Vite dev proxy rewrite).
    # `api` resolves over the compose network; depends_on gates startup order.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        # Baseline security headers on the static SPA. HSTS + a CSP come with
        # TLS. /api responses carry their own headers from the API, so they're
        # set here (not server-wide) to avoid duplicates on the proxied path.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
