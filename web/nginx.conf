# EukaHub web — nginx serves the built SPA and proxies /api/v1 to the api service.

# Reverse-proxy cache for the read-only API. This file is included in nginx's
# `http` context (conf.d/*.conf), the only place proxy_cache_path is allowed.
# The dataset changes only on an offline rebuild, so proxied GETs are safe to
# cache; a shared nginx cache means repeat hits across all clients skip the API
# and the DB entirely. The cache complements the API's ETags: nginx answers a
# client's If-None-Match from the cached entry, and revalidates upstream with the
# ETag when an entry expires (a 304 avoids re-transferring the body).
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=256m inactive=24h use_temp_path=off;

# Per-client limit on /api/: a crawler or script looping over the API can't keep
# the one CPU core busy for everyone. Applied below with a two-stage burst: a
# page's parallel requests pass at once, a long sequential walk (the tree's
# search-to-locate) is slowed to the rate rather than refused, and only a flood
# beyond the burst gets 429.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Behind a reverse proxy every request arrives from the proxy's address, so
    # take the client's from X-Forwarded-For, trusting it only from private
    # networks (where a proxy on the same Docker network lives). A proxy with a
    # public address in front must be added here, or all clients share one limit.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # nginx matches each type exactly (only a bare `*` is a wildcard, `text/*` is not),
    # so every text type the app serves is listed. text/html is always included.
    gzip on;
    gzip_vary on;  # caches downstream must keep compressed and plain copies apart
    gzip_types text/css text/plain text/tab-separated-values
               application/javascript application/json image/svg+xml;

    # API proxy: strip the /api/v1 prefix (mirrors the Vite dev proxy rewrite).
    # `api` resolves over the compose network; depends_on gates startup order.
    location /api/v1/ {
        limit_req zone=api_limit burst=60 delay=20;
        limit_req_status 429;

        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Give up on the API after 60s without data. The API's own per-query
        # limit (DB_STATEMENT_TIMEOUT_MS, 15s) is well below this, so Postgres
        # cancels a slow query itself and the client gets the API's 504 message
        # rather than nginx's.
        proxy_read_timeout 60s;

        # Cache successful GETs. nginx honours the API's Cache-Control (so /health
        # `no-store` is never cached) and its ETag; proxy_cache_revalidate turns
        # an expired entry into a cheap upstream 304 instead of a full re-fetch.
        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_lock on;  # collapse a stampede of misses into one upstream hit
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Surface HIT/MISS/REVALIDATED for debugging and cache-tuning.
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Container healthcheck target, kept out of the access log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        # Baseline security headers on the static SPA. HSTS + a CSP come with
        # TLS. /api responses carry their own headers from the API, so they're
        # set here (not server-wide) to avoid duplicates on the proxied path.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
