name: eukahub-prod

# Production stack: Postgres, the API, nginx serving the web app, and the refresher
# that installs and updates the dataset. Only the web port (8080) is published.
# Configuration comes from infra/.env (see infra/.env.example); operating notes are
# in docs/deployment.md.

# Every service rotates its logs so years of uptime can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    # Sized for a small shared host (one CPU core, ~1 GB RAM for the whole
    # stack). On one core, parallel query/index workers only compete with the
    # process they're helping, and JIT spends CPU + memory compiling queries
    # that finish faster without it. Memory settings stay at Postgres' small
    # defaults (shared_buffers 128MB, work_mem 4MB).
    command:
      - postgres
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - jit=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eukahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-eukahub}
    # No `ports:` — internal network only.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eukahub} -d ${POSTGRES_DB:-eukahub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    logging: *logging
    # Every variable in infra/.env reaches the API, so a new setting needs no
    # change here. Optional, so a stack without one (the low-memory test) starts.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eukahub}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@db:5432/${POSTGRES_DB:-eukahub}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Browsers reach /api same-origin via nginx, so CORS isn't exercised here;
      # set this to real origins if the API is called cross-origin.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080}
      # How long GET responses may be cached downstream (seconds); tune to the
      # offline-rebuild cadence.
      CACHE_MAX_AGE: ${CACHE_MAX_AGE:-3600}
      # Postgres cancels any API query slower than this (ms), so one expensive
      # request can't hold the CPU; must stay below nginx's proxy_read_timeout.
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      # Most DB connections the API uses at once; small, since on one core
      # concurrent heavy queries just slow each other down.
      DB_POOL_MAX: ${DB_POOL_MAX:-4}
      # Curated groups; the defaults apply while infra/config/groups.json is absent.
      GROUPS_FILE: /config/groups.json
    volumes:
      - ./config:/config:ro
    depends_on:
      db:
        condition: service_healthy
    # No published port — reached only via the web/nginx proxy.
    # Healthy == DB-ready: the container probe hits /health/ready (SELECT 1).
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Installs the dataset on first start and keeps it current afterwards, by
  # polling this repo's public Releases (see scripts/auto_refresh.py). It stages
  # and verifies every snapshot before swapping it in, so a bad or unreachable
  # release leaves the running dataset untouched. No credentials: the Release is
  # public, and nothing needs to reach in to this host.
  refresher:
    build:
      context: ..
      dockerfile: infra/refresher.Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eukahub}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@db:5432/${POSTGRES_DB:-eukahub}
      # Point at a fork by setting these; defaults target the upstream repo.
      EUKAHUB_REPO: ${EUKAHUB_REPO:-Cobos-Bioinfo/EukaHub}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-86400}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
