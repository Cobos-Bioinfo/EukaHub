name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, tests, audit
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres seeded with a compact slice of the dataset
      # (api/tests/seed.sql) so the DB-backed API tests run in CI instead of
      # skipping. ltree + pg_trgm ship with the official image.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eukahub
          POSTGRES_PASSWORD: eukahub
          POSTGRES_DB: eukahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eukahub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://eukahub:eukahub@localhost:5432/eukahub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Ruff lint
        run: uv run ruff check .
      - name: Load CI test database
        # Applies the schema + seed slice to the service Postgres. The API tests
        # then connect (via DATABASE_URL) and run instead of skipping.
        run: uv run python scripts/load_ci_db.py
      - name: Tests
        # The DB-backed API integration tests now run against the seeded service
        # DB alongside the pipeline/core unit tests. Regenerate the seed with
        # scripts/generate_ci_seed.py when the schema or needed taxids change.
        run: uv run pytest -q
      - name: Dependency audit (pip-audit)
        # Informational: dependencies are pinned in uv.lock; a fresh advisory
        # should surface here without blocking every merge.
        continue-on-error: true
        run: |
          uv export --format requirements-txt --no-dev --no-emit-workspace -o requirements.txt
          uvx pip-audit -r requirements.txt

  web:
    name: Web — typecheck, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (tsc + vite build)
        run: npm run build
      - name: Dependency audit (npm)
        # Informational (non-blocking).
        continue-on-error: true
        run: npm audit --audit-level=high

  security:
    name: Security — secret scan
    # Skipped on Dependabot PRs. GitHub gives Dependabot-triggered workflows a
    # read-only GITHUB_TOKEN, so gitleaks-action's ScanPullRequest path fails with
    # "Resource not accessible by integration" (a 403 from the PR API), not with a
    # real finding. Coverage is unaffected: Dependabot only touches lockfiles and
    # manifests, and the full history is still scanned on every push to main/dev.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
