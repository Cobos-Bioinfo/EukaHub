name: Dataset rebuild

# Monthly (and on demand): fetch fresh NCBI / Annotrieve / ENA sources, build the
# dataset, gate it on the pipeline's invariant checks, and publish it as the
# `dataset-YYYYMMDD` Release that deployed stacks install (scripts/auto_refresh.py).
# A build that fails the gate publishes nothing. Only the default branch publishes:
# a manual run on another branch builds and uploads the artifact, nothing more.
on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the 1st of each month
  workflow_dispatch: {} # manual "rebuild now" from the Actions tab

# Each job asks for what it needs. The build runs third-party code (actions, the
# datasets binary, every Python dependency), so it only gets a read-only token;
# the write token is confined to the short publish job.
permissions: {}

concurrency:
  group: dataset-rebuild
  cancel-in-progress: false # let an in-flight rebuild finish

jobs:
  keepalive:
    name: Keep the monthly schedule enabled
    # GitHub disables scheduled workflows in public repos after 60 days without
    # repository activity; re-enabling the workflow through the API resets that.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/rebuild.yml/enable"

  rebuild:
    name: Fetch, build, validate, export snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 180 # generous headroom for the ENA / datasets fetch
    permissions:
      contents: read
    outputs:
      stamp: ${{ steps.export.outputs.stamp }}
    services:
      # A throwaway Postgres the build loads into; the schema is applied by the
      # build itself (build.py --schema-dir, idempotent DDL). ltree + pg_trgm ship
      # with the official image.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eukahub
          POSTGRES_PASSWORD: eukahub
          POSTGRES_DB: eukahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eukahub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://eukahub:eukahub@localhost:5432/eukahub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install NCBI datasets CLI
        # fetch_assemblies shells out to the `datasets` binary; grab the static
        # linux-amd64 build and put it on PATH. Left unpinned on purpose: an old
        # client breaks when NCBI changes its API, and nobody is around to bump it.
        run: |
          curl -sSL -o datasets \
            'https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets'
          chmod +x datasets
          sudo mv datasets /usr/local/bin/datasets
          datasets --version

      - name: Build dataset (fresh fetch + invariant gate)
        # Downloads the taxdump, re-fetches all three sources (ignoring any
        # snapshots), rolls up, applies the schema, loads, then validate() runs the
        # hard invariant checks and raises on any violation — failing the job
        # before anything is published or stamped.
        run: uv run --package eukahub-pipeline python -m eukahub_pipeline.build --refresh-sources

      - name: Job summary
        run: uv run --package eukahub-api python scripts/dataset_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Export snapshot (pg_dump, custom format) and Release notes
        id: export
        # Dump with a version-matched client by running pg_dump from the same
        # postgres:17 image (--network host reaches the service on localhost:5432).
        # The asset name must stay constant: deployed stacks pull
        # releases/latest/download/eukahub-dataset.dump. The date lives in the
        # release tag instead, which is what auto_refresh.py compares against.
        run: |
          docker run --rm --network host postgres:17 \
            pg_dump "$DATABASE_URL" --format=custom --compress=6 > eukahub-dataset.dump
          ls -lh eukahub-dataset.dump
          uv run --package eukahub-api python scripts/dataset_summary.py > notes.md
          echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload dataset snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eukahub-dataset
          path: |
            eukahub-dataset.dump
            notes.md
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Publish dataset Release
    needs: rebuild
    # Every server installs the latest Release, so only the default branch may
    # publish one. Scheduled runs always use the default branch (and their event
    # payload carries no repository object to compare against).
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eukahub-dataset

      - name: Publish dataset Release
        # The Release, not the artifact, is what deployed stacks download.
        # Artifacts are deleted after 90 days, so a server that sat idle or a run
        # of failed rebuilds would find nothing left to pull; Releases persist.
        # Re-runnable: a second run on the same day replaces the day's asset
        # rather than failing on the existing tag.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAMP: ${{ needs.rebuild.outputs.stamp }}
        run: |
          if gh release view "dataset-${STAMP}" >/dev/null 2>&1; then
            gh release upload "dataset-${STAMP}" eukahub-dataset.dump --clobber
            gh release edit "dataset-${STAMP}" --notes-file notes.md --latest
          else
            gh release create "dataset-${STAMP}" eukahub-dataset.dump \
              --title "Dataset ${STAMP}" \
              --notes-file notes.md \
              --latest
          fi

  report-failure:
    name: File an issue if a scheduled rebuild failed
    needs: [rebuild, publish]
    # Only for unattended (scheduled) runs — a manual dispatch is already being
    # watched. Keeps "nobody has to worry about it" true: a silent failure
    # surfaces as a tracked issue. The previous snapshot still stands.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const day = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled dataset rebuild failed (${day})`,
              body: [
                'The monthly dataset rebuild failed, so no new snapshot was published.',
                '',
                `Run: ${run}`,
                '',
                'The served data is unchanged (the previous snapshot stands).',
                'Check the fetch / build / invariant-gate step in the run above.',
              ].join('\n'),
            });
