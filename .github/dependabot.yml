version: 2
# Update PRs target `dev`: `main` only moves by fast-forwarding to `dev`, so a commit
# merged straight into `main` would block that. One grouped PR per ecosystem a month.
updates:
  # Keep the CI actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # Frontend dependencies (Python deps are audited via pip-audit in CI; a `uv`
  # ecosystem entry can be added here later for automated update PRs). Major
  # upgrades still arrive one per PR, since they can need code changes.
  - package-ecosystem: "npm"
    directory: "/web"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
