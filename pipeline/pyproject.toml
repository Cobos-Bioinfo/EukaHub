[project]
name = "eukahub-pipeline"
version = "0.1.0"
description = "Offline build pipeline: NCBI taxdump load + clade-feature roll-up."
requires-python = ">=3.12"
dependencies = [
    "eukahub-core",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    # Retries for the Annotrieve and ENA endpoints.
    "tenacity>=9",
    # Roll-up engine (docs/decisions.md).
    "polars>=1.9",
]

[tool.uv.sources]
eukahub-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eukahub_pipeline"]
