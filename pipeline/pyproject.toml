[project]
name = "eukahub-pipeline"
version = "0.1.0"
description = "Offline build pipeline: NCBI taxdump load + clade-feature roll-up."
requires-python = ">=3.12"
dependencies = [
    "eukahub-core",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    # Retry decorator for the flaky Annotrieve + ENA endpoints (ported later).
    "tenacity>=9",
    # Roll-up engine finalists (DECISIONS.md open fork). Both installed during
    # Phase 1 so the roll-up can be written/benchmarked before the pick;
    # Pandas is deliberately excluded.
    "duckdb>=1.1",
    "polars>=1.9",
]

[tool.uv.sources]
eukahub-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eukahub_pipeline"]
